name: killa

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      KILLA_ALLOWED_ORIGINS: ${KILLA_ORIGINS:-}
    command:
      - "-addr"
      - ":8080"
      - "-static"
      - "/app/client/dist"
      - "-rooms"
      - "${KILLA_ROOMS:-16}"
      - "-db"
      - "/data/killa.db"
    volumes:
      - killa_data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      web:
        aliases:
          - killa


volumes:
  killa_data:

networks:
  web:
    external: true
